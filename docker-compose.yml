services:
  nginx:
    image: nginx:alpine
    container_name: neurophoto-nginx
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
      - api
    networks:
      - neurophoto-network
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: neurophoto-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: imageai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - neurophoto-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis (Queue + Pub/Sub)
  redis:
    image: redis:7-alpine
    container_name: neurophoto-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - neurophoto-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO (S3-compatible storage)
  minio:
    image: minio/minio:latest
    container_name: neurophoto-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"      # API port
      - "9001:9001"      # Console port
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - neurophoto-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # MinIO Client (для создания bucket при первом запуске)
  minio-init:
    image: minio/mc:latest
    container_name: neurophoto-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 10;
      /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin123;
      /usr/bin/mc mb myminio/generations --ignore-existing;
      /usr/bin/mc anonymous set public myminio/generations;
      exit 0;
      "
    networks:
      - neurophoto-network

  # NestJS API (HTTP endpoints)
  api:
    build:
      context: ./back/nest-back
      dockerfile: Dockerfile
    container_name: neurophoto-api
    restart: unless-stopped
    env_file:
      - ./back/nest-back/.env
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/imageai
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin123
      MINIO_USE_SSL: "false"
      MINIO_BUCKET: generations
      JWT_SECRET: ${JWT_SECRET:-dev-secret-key-change-in-production}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - neurophoto-network
    volumes:
      - ./back/nest-back/src:/app/src
    command: sh -c "npx prisma migrate deploy && npm run start:prod"

  # NestJS Worker (BullMQ processor)
  worker:
    build:
      context: ./back/nest-back
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./back/nest-back/.env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/imageai
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin123
      MINIO_USE_SSL: "false"
      MINIO_BUCKET: generations
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - neurophoto-network
    volumes:
      - ./back/nest-back/src:/app/src
    command: sh -c "npx prisma migrate deploy && npm run start:worker"
    deploy:
      replicas: 2

  # Next.js Frontend
  web:
    build:
      context: ./neurophoto-front
      dockerfile: Dockerfile
    container_name: neurophoto-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: /api
      BACKEND_URL: http://api:3001
      NEXTAUTH_URL: http://localhost:8080
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-dev-nextauth-secret}
    depends_on:
      - api
    networks:
      - neurophoto-network
    volumes:
      - ./neurophoto-front/app:/app/app
      - ./neurophoto-front/public:/app/public

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local

networks:
  neurophoto-network:
    driver: bridge
